<div [formGroup]="optionFormGroup">
  <table>
    <tr>
      <td>
        <div style="float: left;">
          <span class="site-title">My Forms</span>

          <mat-radio-group formControlName="options" (change)="GetMyForms(optionFormGroup.get('options').value)">

            <mat-radio-button value="0" class="mat-primary" checked id="rdoCurrent" ng-disabled="readOnly">Current Forms</mat-radio-button>
            <mat-radio-button value="1" id="rdoSent" ng-disabled="readOnly">Sent Forms</mat-radio-button>
            <mat-radio-button value="2" id="rdoCompleted" ng-disabled="readOnly" ng-class="tb300">Completed Forms</mat-radio-button>
            <section></section>
          </mat-radio-group>
        </div>
        <div style="float: right;">
          <button type="button" id="btnExit" (click)="tbExit()" title="Click to close this window and go back to main menu" class="home"> </button>
        </div>
        <!-- [(ngModel)]="selected"  style="width: 100%; height: 650px; " -->
      </td>
    </tr>
    <tr>
      <td>
        <div class="divFormList">
          <ag-grid-angular class="ag-theme-balham grdForm" id="grdForm" 
                           [gridOptions]="goForms"
                           [columnDefs]="colForms"
                           [rowData]="formData"
                           (cellClicked)="onCellClicked($event)"></ag-grid-angular>
        </div>
      </td>
    </tr>
  </table>

</div>
