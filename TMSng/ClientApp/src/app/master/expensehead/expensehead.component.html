<form [formGroup]="frmExpenseHead">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Expense Head</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
        <!--  <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>-->
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>Expense Id</mat-label>
          <input type="text" formControlName="expenseId" #expenseId matTooltip="Expense Head Id, auto generated for new entry" matInput maxlength="3" numbersOnly (keydown.enter)="get(expenseId.value)">
        </mat-form-field>
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="isActive" color="primary" >Is Active</mat-slide-toggle>
      </td>
      <td colspan="3"></td>
      <td colspan="2"></td>
    </tr>

    <tr>
      <td colspan="3">
        <mat-form-field class="tb350">
          <mat-label>Expense Name</mat-label>
          <input formControlName="expenseName" #expenseName matTooltip="Expense head name / narration" matInput maxlength="50" required>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb200"  *ngIf="!frmExpenseHead.get('enableGLEntries').value">
          <mat-label>Charge Code</mat-label>
          <mat-select name="ChargeCode" formControlName="chargeCode" required>
            <mat-option *ngFor="let cc of lstChargeCode" [value]="cc.chargeCode">
              {{cc.chargeName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb200" *ngIf="frmExpenseHead.get('enableGLEntries').value">
          <mat-label>Expense GL Account</mat-label>
          <mat-select name="AccountId" formControlName="accountId" required>
            <mat-option *ngFor="let acc of lstAccount" [value]="acc.accountId">
              {{acc.accountName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb200" *ngIf="frmExpenseHead.get('enableGLEntries').value">
          <mat-label>Payable Expense GL</mat-label>
          <mat-select name="AdvAccountId" formControlName="advAccountId" required>
            <mat-option *ngFor="let acc of lstAccount" [value]="acc.accountId">
              {{acc.accountName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="2" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
