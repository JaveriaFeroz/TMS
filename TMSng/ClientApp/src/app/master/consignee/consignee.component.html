<form [formGroup]="frmConsignee">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Consignee Setup</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>Consignee Id</mat-label>
          <input formControlName="consigneeId" #consigneeId matTooltip="Consignee ID, auto generated for new entry"  matInput maxlength="3" numbersOnly (keydown.enter)="get(consigneeId.value)">
        </mat-form-field>
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="isActive" color="primary">Is Active</mat-slide-toggle>
      </td>
      <td colspan="3"></td>
      <td colspan="2"></td>
    </tr>

    <tr>
      <td  colspan="3">
        <mat-form-field class="tb350">
          <mat-label>Consignee Name</mat-label>
          <input formControlName="consigneeName" #consigneeName matTooltip="Enter Consignee Name"  matInput maxlength="50" required>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb250">
          <mat-label>Client</mat-label>
          <mat-select formControlName="clientId" required>
            <mat-option *ngFor="let c of lstClient" [value]="c.clientId">
              {{c.clientName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb150">
          <mat-label>City</mat-label>
          <mat-select formControlName="cityId" required>
            <mat-option *ngFor="let City of lstCity" [value]="City.cityId">
              {{City.cityName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Contact #</mat-label>
          <input formControlName="contactNo" matTooltip="Enter Contact #" matInput maxlength="12">
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td  colspan="3">
        <mat-form-field class="tb500">
          <mat-label>Address</mat-label>
          <textarea matInput formControlName="address" matTooltip="Enter Address" maxlength="200"
                    cdkTextareaAutosize
                    cdkAutosizeMinRows="2"
                    cdkAutosizeMaxRows="5" required></textarea>
        </mat-form-field>
      </td>
    </tr>
    <tr>
      <td colspan="2" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
