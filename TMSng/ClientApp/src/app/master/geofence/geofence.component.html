<form [formGroup]="frmGeoFence">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Geo Fence</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>Fence Id</mat-label>
          <input formControlName="fenceId" #fenceId matTooltip="Fence Id, auto generated for new entry" matInput maxlength="3" numbersOnly (keydown.enter)="get(fenceId.value)">
        </mat-form-field>
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="isActive" color="primary">Is Active</mat-slide-toggle>
      </td>
      <td colspan="3"></td>
      <td colspan="2"></td>
    </tr>

    <tr>
      <td  colspan="3">
        <mat-form-field class="tb300">
          <mat-label>Geo Fence Name</mat-label>
          <input formControlName="fenceName" #fenceName matTooltip="Enter Locatoin Name" matInput maxlength="50" required>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmGeoFence.get('FenceName').value && frmGeoFence.get('FenceName').touched">Fence description is a required field</mat-error>-->
      </td>
      <td></td>
      <td></td>
      <td colspan="2" rowspan="4">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb200">
          <mat-label>City</mat-label>
          <mat-select formControlName="cityId">
            <mat-option *ngFor="let City of lstCity" [value]="City.cityId">
              {{City.cityName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmGeoFence.get('CityId').value && frmGeoFence.get('CityId').touched">City is a required field</mat-error>-->

      </td>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Radius</mat-label>
          <input type="number" formControlName="radius" min="1" step="0.01" max="20" matTooltip="Enter Radius" maxlength="5" matInput oninput="validity.valid||(value='');" required>
        </mat-form-field>
       <!-- <mat-error *ngIf="!frmGeoFence.get('Radius').value && frmGeoFence.get('Radius').touched">Radius cannot be Equal or Less then Zero</mat-error>-->
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Longitude</mat-label>
          <input type="number" formControlName="longitude" min="1" step="0.01" max="100" matTooltip="Enter Longitude" maxlength="9" matInput oninput="validity.valid||(value='');" required>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmGeoFence.get('Longitude').value && frmGeoFence.get('Longitude').touched">Longitude cannot be Equal or Less then Zero</mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Latitude</mat-label>
          <input type="number" formControlName="latitude" min="1" step="0.01" max="100" matTooltip="Enter Latitude" maxlength="9" matInput oninput="validity.valid||(value='');" required>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmGeoFence.get('Latitude').value && frmGeoFence.get('Latitude').touched">Latitude cannot be Equal or Less then Zero</mat-error>-->
      </td>
    </tr>

    <tr>
      <td colspan="4">
        <div class="divFCEGrid">
          <div class="grdToolbar" id="tbGrid">
            <button (click)="onAddLine()" id="btnGridAdd" class="add" title="Add Line Item"></button>
            <button (click)="onDeleteLine()" id="btnGridDelete" class="delete" title="Remove selected line item"></button>
          </div>
          <ag-grid-angular class="ag-theme-balham grdFCE" id="grdFCE"
                           [gridOptions]="goFenceClientEmail"
                           [columnDefs]="colFenceClientEmail"
                           [rowData]="fenceClientEmailData"></ag-grid-angular>
        </div>
      </td>
     
    </tr>

  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
