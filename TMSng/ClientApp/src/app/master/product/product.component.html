<form [formGroup]="frmProduct">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Product</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>Product Id</mat-label>
          <input formControlName="productId" #productId matTooltip="Product Id, auto generated for new entry"  matInput maxlength="3" numbersOnly (keydown.enter)="get(productId.value)">
        </mat-form-field>
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="isActive" color="primary">Is Active</mat-slide-toggle>
      </td>
      <td colspan="3"></td>
      <td colspan="2"></td>
    </tr>

    <tr>
      <td colspan="3">
        <mat-form-field class="tb350">
          <mat-label>Product Name</mat-label>
          <input formControlName="productName" matTooltip="Product Name"  matInput maxlength="50" required readonly>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Purchase Price</mat-label>
          <input type="number" formControlName="purchasePrice" min="1" matTooltip="Enter Purchase Price" matInput maxlength="9" required>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb200">
          <mat-label>Product Type</mat-label>
          <mat-select formControlName="productTypeId" #productType required>
            <mat-option *ngFor="let pt of lstProductType" [value]="pt.typeId">
              {{pt.typeName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb200">
          <mat-label>Product Nature</mat-label>
          <input formControlName="productNatureName" matTooltip="Product Nature" matInput maxlength="50" readonly>
          <!--<mat-select formControlName="ProductNatureId" required>
    <mat-option *ngFor="let pn of lstProductNature" [value]="pn.natureId">
      {{pn.natureName}}
    </mat-option>
  </mat-select>-->
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb200">
          <mat-label>UoM</mat-label>
          <input formControlName="uoMName" #uom matTooltip="Unit of Measure" matInput maxlength="50" readonly>
          <!--<mat-select formControlName="UoMId" required>
    <mat-option *ngFor="let u of lstUOM" [value]="u.uomId">
      {{u.uomName}}
    </mat-option>
  </mat-select>-->
        </mat-form-field>
      </td>
    </tr>
    <tr>
      <td colspan="2" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
