<form [formGroup]="frmSKU">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Client SKU</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>SKU Id</mat-label>
          <input formControlName="skuId" #skuId matTooltip="SKU Id, auto generated for new entry" matInput maxlength="3" numbersOnly (keydown.enter)="get(skuId.value)">
        </mat-form-field>
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="isActive" color="primary">Is Active</mat-slide-toggle>
      </td>
      <td colspan="3"></td>
      <td colspan="2"></td>
    </tr>

    <tr>
      <td colspan="3">
        <mat-form-field class="tb300">
          <mat-label>SKU Name</mat-label>
          <input formControlName="skuName" #skuName matTooltip="Enter SKU Name"  matInput maxlength="50" required>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100"  *ngIf="frmSKU.get('enableGLEntries').value">
          <mat-label>SKU Type</mat-label>
          <mat-select name="SKUType" formControlName="skuTypeId">
            <mat-option *ngFor="let st of lstSKUType" [value]="st.typeId">
              {{st.typeName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>
     
      <td colspan="3" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>

    <tr>
      <td colspan="2">
        <div class="divClientGrid">
          <div class="grdToolbar" id="tbGrid">
            <button  type="button" (click)="onAddClient()" id="btnAddClient" class="add" title="Add Line Item"></button>
            <button  type="button" (click)="onDeleteClient()" id="btnDeleteClient" class="delete" title="Remove selected line item"></button>
          </div>
          <ag-grid-angular class="ag-theme-balham grdClient" id="grdClient"
                           [gridOptions]="goClient"
                           [columnDefs]="colClient"
                           [rowData]="clientData"></ag-grid-angular>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
