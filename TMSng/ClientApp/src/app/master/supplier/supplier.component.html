<form [formGroup]="frmSupplier">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Supplier</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" *ngIf="frmSupplier.get('enableGLEntries').value" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>Id</mat-label>
          <input formControlName="supplierId" #supplierId matTooltip="Supplier Id, auto generated for new entry" matInput maxlength="3" numbersOnly (keydown.enter)="get(supplierId.value)">
        </mat-form-field>
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="isActive" color="primary">Is Active</mat-slide-toggle>
      </td>
      <td colspan="3"></td>
      <td colspan="2"></td>
    </tr>

    <tr>
      <td colspan="2">
        <mat-form-field class="tb350">
          <mat-label>Supplier Name</mat-label>
          <input formControlName="supplierName" #supplierName matTooltip="Supplier Name" matInput maxlength="50" required>
        </mat-form-field>
      </td>
      <td colspan="2">
        <mat-form-field class="tb300">
          <mat-label>Address </mat-label>
          <input formControlName="address" matTooltip="Postal Address" matInput maxlength="150" required>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td >
        <mat-form-field class="tb200">
          <mat-label>Supplier Type</mat-label>
          <mat-select formControlName="supplierTypeId" required>
            <mat-option *ngFor="let st of lstSupplierType" [value]="st.typeId">
              {{st.typeName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb170">
          <mat-label>Control Supplier</mat-label>
          <input formControlName="ControlSupplierId" matTooltip="Enter Control Supplier " matInput maxlength="10" required>
        </mat-form-field>
      </td>      
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb250">
          <mat-label>Select City</mat-label>
          <mat-select formControlName="cityId" required>
            <mat-option *ngFor="let City of lstCity" [value]="City.cityId">
              {{City.cityName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb250">
          <mat-label>Contact Name</mat-label>
          <input formControlName="contactName" matTooltip="Contact Person Name" matInput maxlength="50">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb200">
          <mat-label>Email</mat-label>
          <input formControlName="email" matTooltip="Enter Email" matInput maxlength="100">
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb170">
          <mat-label>Phone #</mat-label>
          <input formControlName="phoneNo" matTooltip="Phone # in 0213-1234567 format" matInput maxlength="30">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb170">
          <mat-label>Mobile #</mat-label>
          <input formControlName="mobileNo" matTooltip="Mobile # in 0333-1234567 format" matInput maxlength="30">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb170">
          <mat-label>Fax #</mat-label>
          <input formControlName="faxNo" matTooltip="Fax #" matInput maxlength="30">
        </mat-form-field>
      </td>      
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb170">
          <mat-label>NTN #</mat-label>
          <input formControlName="ntn" matTooltip="NTN #" matInput maxlength="20">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb170">
          <mat-label>URL </mat-label>
          <input formControlName="url" matTooltip="Supplier website address" matInput maxlength="50">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>SC Rate</mat-label>
          <input type="number" formControlName="scRate" min="0" max="100" step="0.10" matTooltip="Service Charges Rate" matInput maxlength="5" required>
        </mat-form-field>
      </td>
    </tr>
    <tr>
      <td colspan="2" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
