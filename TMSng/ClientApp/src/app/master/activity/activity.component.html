<form [formGroup]="frmActivity">
  <table class="mainTable">
    <tr class="form-title-bg tbl_header">
      <td colspan="5">
        <p class="form-title">Activity</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Click to find from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to Create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>Activity Id</mat-label>
          <input type="text" formControlName="activityId" #activityId matTooltip="Activity Id, auto generated for new entry" matInput maxlength="3" numbersOnly (keydown.enter)="get(activityId.value)">
        </mat-form-field>
      </td>
      <td class="slider">
         <mat-slide-toggle formControlName="isActive" color="primary">Is Active</mat-slide-toggle>
      </td>
      <td colspan="3"></td>
      <td colspan="2"></td>
    </tr>

    <tr>
      <td colspan="3">
        <mat-form-field class="tb350">
          <mat-label>Activity Name</mat-label>
          <input formControlName="activityName" #activityName matTooltip="Enter Activity name"  matInput maxlength="50" required>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Est Hrs</mat-label>
          <input type="number" formControlName="estHRsReq" matTooltip="Estimate Hrs required to perform this activity" min="0" step="0.05" placeholder="Estimated HRs Required" matInput maxlength="6" oninput="validity.valid||(value='');" required/>
        </mat-form-field>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
