<form [formGroup]="frmClient">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Client Setup</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>Client Id</mat-label>
          <input formControlName="clientId" #clientId matTooltip="Client Id, auto generated for new entry" matInput maxlength="3" numbersOnly (keydown.enter)="get(clientId.value)">
        </mat-form-field>
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="isActive" color="primary">Is Active</mat-slide-toggle>
      </td>

      <td>
        <mat-form-field class="tb60">
          <mat-label>Acc Id</mat-label>
          <input formControlName="accountId" matTooltip="AccountId Id, it could be Client's corporate Id if billing needs to be charged to corporate account" matInput maxlength="3" numbersOnly>
        </mat-form-field>
      </td>
      <td colspan="2"></td>
      <td colspan="4"></td>
      <td></td>
    </tr>

    <tr>
      <td colspan="2">
        <mat-form-field class="tb350">
          <mat-label>Client Name</mat-label>
          <input formControlName="clientName" #clientName matTooltip="Enter Client Name" matInput maxlength="50" required>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('ClientName').value && frmClient.get('ClientName').touched">Client Description is a required field</mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb90">
          <mat-label>Short Name</mat-label>
          <input formControlName="shortName" #clientName matTooltip="Short Name mainly referred in graphical reports" matInput maxlength="5" required>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('ShortName').value && frmClient.get('ShortName').touched">Client Short Name is a required field</mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb150">
          <mat-label>City</mat-label>
          <mat-select formControlName="cityId" required>
            <mat-option *ngFor="let cy of lstCity" [value]="cy.cityId">
              {{cy.cityName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('CityId').value && frmClient.get('CityId').touched">Select City</mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb150">
          <mat-label>Industry Vertical</mat-label>
          <mat-select formControlName="industryVerticalId" required>
            <mat-option *ngFor="let iv of lstIndustry" [value]="iv.verticalId">
              {{iv.verticalName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('IndustryVerticalId').value && frmClient.get('IndustryVerticalId').touched">Select Industry</mat-error>-->
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb130">
          <mat-label>Contact Person</mat-label>
          <input formControlName="contactPerson" matTooltip="Enter Contact Person" matInput maxlength="50" required>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('ContactPerson').value && frmClient.get('ContactPerson').touched">Enter Contact Person</mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Contact #</mat-label>
          <input formControlName="contactNo" matTooltip="Enter Contact # in 9999-9999999 format" matInput maxlength="12" required>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('ContactNo').value && frmClient.get('ContactNo').touched">Enter Correct  # xxxx-xxxxxxx</mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb170">
          <mat-label>Email</mat-label>
          <input type="email" formControlName="email" matTooltip="Email address of the client" matInput maxlength="50" required>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('Email').value && frmClient.get('Email').touched">Enter Correct Email Addresss xyx@abc.com </mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>URL</mat-label>
          <input formControlName="url" matTooltip="Enter URL" matInput maxlength="50">
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('URL').value && frmClient.get('URL').touched"></mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>CW Client Id</mat-label>
          <input type="text" formControlName="cwClientId" matTooltip="Cargo Wise 1 Client Id to which Invoices will be interfaced" matInput maxlength="10">
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('ControlClientId').value && frmClient.get('ControlClientId').touched">Enter Control Client #</mat-error>-->
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb120">
          <mat-label>MoP</mat-label>
          <mat-select formControlName="paymentModeId" required>
            <mat-option *ngFor="let pm of lstPaymentMode" [value]="pm.paymentModeId">
              {{pm.paymentModeName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('PaymentModeId').value && frmClient.get('PaymentModeId').touched">Select Payment Mode</mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Credit Limit</mat-label>
          <input type="number" formControlName="creditLimit" min="1" max="999999999" matTooltip="Credit Limit sanctioned to this Client" matInput maxlength="9" oninput="validity.valid||(value='');" required />
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('CreditLimit').value && frmClient.get('CreditLimit').touched">Credit Limit Cannot be less then Zero</mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Credit Days</mat-label>
          <input type="number" formControlName="creditDays" min="1" max="365" matTooltip="Credit Days sanctioned to this Client" matInput maxlength="3" oninput="validity.valid||(value='');" required />
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('CreditDays').value && frmClient.get('CreditDays').touched">Credit Days Cannot be less then Zero</mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>NTN #</mat-label>
          <input formControlName="ntn" matTooltip="Enter NTN #" matInput maxlength="9">
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('NTN').value && frmClient.get('NTN').touched"></mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>STRN #</mat-label>
          <input formControlName="strn" matTooltip="Enter STRN" matInput maxlength="13">
        </mat-form-field>
        <!--<mat-error *ngIf="!frmClient.get('STRN').value && frmClient.get('STRN').touched"></mat-error>-->
      </td>
    </tr>

    <tr>
      <td colspan="3" rowspan="2">
        <mat-form-field class="tb400">
          <mat-label>Address</mat-label>
          <textarea matInput formControlName="address" matTooltip="Registered postal address of the client" maxlength="200"
                    cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="3" required></textarea>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Contract Period(Months)</mat-label>
          <input type="number" formControlName="contractPeriod" min="0" max="999" matTooltip="Enter Contract Period" matInput maxlength="3" oninput="validity.valid||(value='');">
        </mat-form-field>
      </td>
      <!--<td>
    <mat-form-field class="tb100">
      <mat-label>Std Load Time</mat-label>
      <input type="number" formControlName="StandardLoadingTime" matTooltip="Enter StandardLoading Time" min="0" max="100" matInput maxlength="3" oninput="validity.valid||(value='');" />
    </mat-form-field>

  </td>-->
    </tr>
    <tr></tr>

    <tr>
      <td colspan="3">
        <div class="divCIFGrid">
          <div class="grdToolbar" id="tbGrid">
            <button  type="button" (click)="onAddLine()" id="btnGridAdd" class="add" title="Add Line Item"></button>
            <button  type="button" (click)="onDeleteLine()" id="btnGridDelete" class="delete" title="Remove selected line item"></button>
          </div>
          <ag-grid-angular class="ag-theme-balham grdCIF" id="grdCIF"
            [gridOptions]="goInvFormat"
            [columnDefs]="colInvFormat"
            [rowData]="invFormatData"></ag-grid-angular>
        </div>
      </td>
      <td colspan="2" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
