<form [formGroup]="frmFuelCard">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Fuel Card</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>Card Id</mat-label>
          <input formControlName="cardId" #cardId matTooltip="Card Id, auto generated for new entry" matInput maxlength="3" numbersOnly (keydown.enter)="get(cardId.value)">
        </mat-form-field>
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="isActive" color="primary">Is Active</mat-slide-toggle>
      </td>
      <td colspan="3"></td>
      <td colspan="2"></td>
    </tr>

    <tr>
      <td  colspan="3">
        <mat-form-field class="tb350">
          <mat-label>Card #</mat-label>
          <input formControlName="cardNo" #cardNo matTooltip="Unique Card #"  matInput maxlength="50" required>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmFuelCard.get('CardNumber').value && frmFuelCard.get('CardNumber').touched">Card # is a required field</mat-error>-->
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb200">
          <mat-label>Client</mat-label>
          <mat-select formControlName="clientId" required>
            <mat-option *ngFor="let c of lstClient" [value]="c.clientId">
              {{c.clientName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmFuelCard.get('ClientId').value && frmFuelCard.get('ClientId').touched">Client is a required field</mat-error>-->
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb200">
          <mat-label>Supplier</mat-label>
          <mat-select formControlName="supplierId" required>
            <mat-option *ngFor="let s of lstSupplier" [value]="s.supplierId">
              {{s.supplierName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmFuelCard.get('SupplierId').value && frmFuelCard.get('SupplierId').touched">Supplier is a required field</mat-error>-->
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Card Limit</mat-label>
          <input type="number" formControlName="cardLimit" min="1" max="99999999" matTooltip="Enter Credit Limit in Liters" matInput maxlength="9" oninput="validity.valid||(value='');" required />
        </mat-form-field>
        <!--<mat-error *ngIf="!frmFuelCard.get('CardLimit').value && frmFuelCard.get('CardLimit').touched">Card Limit Cannot be less then Zero</mat-error>-->
      </td>
    </tr>    
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
