<form [formGroup]="frmUserMgmt">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">User Management</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
         <!-- <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>-->
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry"  (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100" color="accent">
          <mat-label>User Id</mat-label>
          <input formControlName="userId" #userId matTooltip="Enter UserId" matInput maxlength="20" (keydown.enter)="get(userId.value)">
        </mat-form-field>      
      <td class="slider">
        <mat-slide-toggle formControlName="isActive" color="primary" readonly tabindex="-1">Is Active</mat-slide-toggle>
      </td>      
    </tr>

    <tr>
      <td>
        <mat-form-field>
          <mat-label>User Name</mat-label>
          <input formControlName="userName" readonly tabindex="-1" matInput>
        </mat-form-field>
      </td>
     
      <td>
        <mat-form-field>
          <mat-label>Branch Name</mat-label>
          <input formControlName="branchName" readonly tabindex="-1" matInput>
        </mat-form-field>
      </td>

      <td colspan="2" rowspan="3" style="align-items: top;">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field >
          <mat-label>Department Name</mat-label>
          <input formControlName="departmentName" readonly tabindex="-1" matInput>
        </mat-form-field>
      </td>
    
      <td>
        <mat-form-field>
          <mat-label>Email</mat-label>
          <input formControlName="email" readonly tabindex="-1" matInput>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="4">
        <div>
          <mat-tab-group>
            <mat-tab label="Option">
              <ag-grid-angular class="ag-theme-balham grdOption" id="grdOption"
                               [gridOptions]="goOptions"
                               [columnDefs]="colOption"
                               [rowData]="optionData"></ag-grid-angular>
            </mat-tab>
            <mat-tab label="Branch">
              <ag-grid-angular class="ag-theme-balham grdBranch" id="grdBranch"
                               [gridOptions]="goBranch"
                               [columnDefs]="colBranch"
                               [rowData]="branchData"></ag-grid-angular>
            </mat-tab>
            <mat-tab label="Role">
              <ag-grid-angular class="ag-theme-balham grdRole" id="grdRole" 
                               [gridOptions]="goRole"
                               [columnDefs]="colRole"
                               [rowData]="roleData"></ag-grid-angular>
            </mat-tab>
            <mat-tab label="City">
              <ag-grid-angular class="ag-theme-balham grdCity" id="grdCity" 
                               [gridOptions]="goCity"
                               [columnDefs]="colCity"
                               [rowData]="cityData"></ag-grid-angular>
            </mat-tab>
            <mat-tab label="Company">
              <ag-grid-angular class="ag-theme-balham grdCompany" id="grdCompany" 
                               [gridOptions]="goCompany"
                               [columnDefs]="colCompany"
                               [rowData]="companyData"></ag-grid-angular>
            </mat-tab>
          </mat-tab-group>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
