<form [formGroup]="frmJob">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Job Registeration</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100" color="accent">
          <mat-label>Job #</mat-label>
          <input formControlName="jobNo" #jobNo matTooltip="Job #, auto generated for new entry"  matInput maxlength="10"  (keydown.enter)="get(jobNo.value)">
        </mat-form-field>
      </td>
     
     <td></td>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Status</mat-label>
          <input formControlName="stateName" matTooltip="Job Status" matInput readonly tabindex="-1">
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb120">
          <mat-label>Job Date</mat-label>
          <input matInput [matDatepicker]="mdpJobDate" [min]="MinDate" [max]="MaxDate" matTooltip="Job Date" formControlName="jobDate" #jodate  required>
          <mat-datepicker-toggle matSuffix [for]="mdpJobDate"></mat-datepicker-toggle>
          <mat-datepicker #mdpJobDate></mat-datepicker>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmJob.get('JobDate').value && frmJob.get('JobDate').touched">Select Date</mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Advance</mat-label>
          <input type="number" formControlName="advance" min="0" max="99999999" matTooltip="Advance amount paid for the job" maxlength="9" matInput oninput="validity.valid||(value='');" required>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td >
        <mat-form-field class="tb120">
          <mat-label>Start Date</mat-label>
          <input matInput [matDatepicker]="mdpJobSDate" [min]="MinDate" [max]="MaxDate" matTooltip="Job Start Date" formControlName="jobStartDate"  required>
          <mat-datepicker-toggle matSuffix [for]="mdpJobSDate"></mat-datepicker-toggle>
          <mat-datepicker #mdpJobSDate></mat-datepicker>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmJob.get('JobStartDate').value && frmJob.get('JobStartDate').touched">Select Job Start Date</mat-error>-->
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Start Time</mat-label>
          <input type="time" matInput matTooltip="Job Start Time" formControlName="jobStartTime" required>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmJob.get('JobStartTime').value && frmJob.get('JobStartTime').touched">Select Job Start Time</mat-error>-->
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
