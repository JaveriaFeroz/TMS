<form [formGroup]="frmRWBExpense">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Rwb Expense</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <!--<button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>-->
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100" color="accent">
          <mat-label>Rwb Id</mat-label>
          <input formControlName="rwbNo" #rwbno matTooltip="Rwb ID" matInput maxlength="10" numbersOnly (keydown.enter)="get(rwbno.value)">
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb150">
          <mat-label>Branch</mat-label>
          <mat-select formControlName="branchId" #branch required>
            <mat-option *ngFor="let Branch of lstBranch" [value]="Branch.branchId">
              {{Branch.branchName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Rwb  Date</mat-label>
          <input formControlName="rwbDate" matTooltip="RWB Date" matInput readonly tabindex="-1">
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Job Status</mat-label>
          <input formControlName="jobStateName" matTooltip="Job Status" matInput readonly tabindex="-1">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Job Date</mat-label>
          <input formControlName="jobDate" matTooltip="Job Date" matInput readonly tabindex="-1">
        </mat-form-field>
      </td>
      <td></td>
      <td colspan="2" rowspan="2">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Fuel Avg</mat-label>
          <input formControlName="fuelAvg" matTooltip="Fuel Avg" matInput readonly tabindex="-1">
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Transit Time</mat-label>
          <input formControlName="transitTime" matTooltip="Transit Time" matInput readonly tabindex="-1">
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Job #</mat-label>
          <input formControlName="jobNo" matTooltip="Job #" matInput readonly tabindex="-1">
        </mat-form-field>
      </td>
    
      <td>
        <mat-form-field class="tb100">
          <mat-label>Job Start Date</mat-label>
          <input formControlName="jobStartDate" matTooltip="Start Date" matInput readonly tabindex="-1">
        </mat-form-field>
      </td>

      <td colspan="2">
        <mat-form-field class=" tb500">
          <mat-label>Comments</mat-label>
          <textarea matInput formControlName="comments" matTooltip="Enter Comments " maxlength="500" cdkTextareaAutosize
            cdkAutosizeMinRows="2" cdkAutosizeMaxRows="5"></textarea>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="10">
        <!--<mat-tab-group (selectedTabChange)="validateGridStatus()">
          <mat-tab label="Expense Head" >-->
        <div class="divGrids">
          <div class="divExpense">
            <div class="grdToolbar" id="tbGrid">
              <button type="button" (click)="onAddExpenseLine()" id="btnGridExpenseAdd" class="add" title="Add Line Item"></button>
              <!--<button  type="button" (click)="onDeleteExpenseLine()" id="btnGridExpenseDelete" class="delete" title="Remove selected line item"></button>-->
            </div>
            <ag-grid-angular class="ag-theme-balham grdExpense" id="grdExpense"
                             [gridOptions]="goExpense" (cellValueChanged)="onExpenseCellValueChanged($event)"
                             [columnDefs]="colExpense"
                             [rowData]="expenseData"></ag-grid-angular>

            <!--</mat-tab>
    <mat-tab label="Other Charges" >-->
            </div>
            <div class="divCharges">
              <div class="grdToolbar" id="tbGrid">
                <button type="button" (click)="onAddChargeLine()" id="btnGridChargeAdd" class="add" title="Add Line Item"></button>
                <button type="button" (click)="onDeleteChargeLine()" id="btnGridChargeDelete" class="delete" title="Remove selected line item"></button>
              </div>
              <ag-grid-angular class="ag-theme-balham grdCharges" id="grdCharges"
                               [gridOptions]="goCharges" (cellValueChanged)="onChargeCellValueChanged($event)"
                               [columnDefs]="colCharges"
                               [rowData]="chargesData"></ag-grid-angular>
            </div>
            <!--</mat-tab>
    <mat-tab label="Cash Fuel" *ngIf="frmRWBExpense.get('enableGLEntries').value==true">-->
            <div class="divCashFuel">
              <div class="grdToolbar" id="tbGrid">
                <button type="button" (click)="onAddFuelLine()" id="btnGridFuelAdd" class="add" title="Add Line Item"></button>
                <button type="button" (click)="onDeleteFuelLine()" id="btnGridFuelDelete" class="delete" title="Remove selected line item"></button>
              </div>
              <ag-grid-angular class="ag-theme-balham grdCashFuel" id="grdFuel"
                               [gridOptions]="goFuel" [frameworkComponents]="frameworkComponents" (cellValueChanged)="onFuelCellValueChanged($event)"
                               [columnDefs]="colFuel"
                               [rowData]="fuelData"></ag-grid-angular>
            </div>
            <!--</mat-tab>
    </mat-tab-group>-->
          </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
