<form [formGroup]="frmPM">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Preventive Maintenance Plan</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>PM Id</mat-label>
          <input formControlName="pmId" #pmId matTooltip="Preventive Maintenance Id, auto generated for new entry" matInput maxlength="3" numbersOnly (keydown.enter)="get(pmId.value)">
        </mat-form-field>
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="isActive" color="primary">Is Active</mat-slide-toggle>
      </td>
      <td colspan="3"></td>
      <td colspan="2" rowspan="4" style="vertical-align:top">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb250">
          <mat-label>Activity</mat-label>
          <mat-select formControlName="activityId" #activityId required>
            <mat-option *ngFor="let a of lstActivity" [value]="a.activityId"> {{a.activityName}} </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb150">
          <mat-label>Vehicle Capacity</mat-label>
          <mat-select formControlName="capacityId" required>
            <mat-option *ngFor="let c of lstCapacity" [value]="c.capacityId"> {{c.capacityName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb200">
          <mat-label>Asset Make</mat-label>
          <mat-select formControlName="assetMakeId" required>
            <mat-option *ngFor="let m of lstAssetMake" [value]="m.makeId"> {{m.makeName}}</mat-option>
          </mat-select>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Due KMs</mat-label>
          <input type="number" formControlName="dueKMs" min="1" matTooltip="Enter Due KMs for Preventive Maintenance" matInput maxlength="6" oninput="validity.valid||(value='');" required />
        </mat-form-field>
      </td>
    
      <td>
        <mat-form-field class="tb100">
          <mat-label>Alert KMs</mat-label>
          <input type="number" formControlName="alertKMs" min="1"
                 matTooltip="Enter KMs when user should be notified for approaching PM through email" matInput maxlength="6" oninput="validity.valid||(value='');" required />
        </mat-form-field>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
