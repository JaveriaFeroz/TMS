<form [formGroup]="frmServiceRequest">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Service Request</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" *ngIf="frmServiceRequest.get('stateId').value==0 || frmServiceRequest.get('stateId').value==1 ||  frmServiceRequest.get('stateId').value==5"
                  matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>Request #</mat-label>
          <input formControlName="requestId" #requestId matTooltip="Request Id, auto generated for new entry"  matInput maxlength="6" numbersOnly (keydown.enter)="get(requestId.value)">
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb120">
          <mat-label>Date</mat-label>
          <input formControlName="requestDate" [min]="minDate" [max]="maxDate"  matTooltip="Service Request Date" matInput [matDatepicker]="mdpRDate" required>
          <mat-datepicker-toggle matSuffix [for]="mdpRDate"></mat-datepicker-toggle>
          <mat-datepicker #mdpRDate></mat-datepicker>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmServiceRequest.get('SVRDate').value && frmServiceRequest.get('SVRDate').touched">Select SR Date</mat-error>-->
      </td>
      <td>
        <mat-form-field class="tb150">
          <mat-label>Status</mat-label>
          <input formControlName="stateName" matInput disabled readonly tabindex="-1">
        </mat-form-field>
      </td>

      <td colspan="2" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb200">
          <mat-label>Request Type</mat-label>
          <mat-select formControlName="requestTypeId" #complaintType required>
            <mat-option *ngFor="let ct of lstRequestType" [value]="ct.typeId">
              {{ct.typeName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmServiceRequest.get('RequestTypeId').value && frmServiceRequest.get('RequestTypeId').touched">Select Complaint Type</mat-error>-->
      </td>
      
      <td>
        <div class="float-left">
          <mat-form-field class=" tb100">
            <mat-label>Asset </mat-label>
            <mat-select name="Asset" formControlName="vehicleId" required>
              <mat-option *ngFor="let a of lstAsset" [value]="a.assetId">
                <!-- (onSelectionChange)="onAssetSelection($event, Asset.AssetId)"   -->
                {{a.assetNo}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <!--<mat-error *ngIf="!frmServiceRequest.get('AssetId').value && frmServiceRequest.get('AssetId').touched">Select Asset</mat-error>-->
        </div>
        </td>
      <td>
        <button id="btnAsset" matTooltip="View Asset Maintenance History" *ngIf="frmServiceRequest.get('vehicleId').value"
                (click)="tbAssetHistory(frmServiceRequest.get('vehicleId').value)" class="history"></button>
      </td>
     </tr>  

    <tr>
      <td>
        <mat-form-field class="tb200">
          <mat-label>Complainant</mat-label>
          <mat-select name="Complainant" formControlName="complainantId" required>
            <mat-option *ngFor="let c of lstComplainant" [value]="c.complainantId">
              {{c.complainantName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmServiceRequest.get('ComplainantId').value && frmServiceRequest.get('ComplainantId').touched">Select Complaint By</mat-error>-->
      </td>


      <td>
        <mat-form-field class="tb200">
          <mat-label>Service Requested By</mat-label>
          <input formControlName="requestorName" matTooltip="Enter requestor name" matInput maxlength="50" required>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmServiceRequest.get('RequestedBy').value && frmServiceRequest.get('RequestedBy').touched">Enter Service Request Name</mat-error>-->
      </td>

      <td>
        <div id="watermark" *ngIf="frmServiceRequest.get('stateId').value==4 ">Work Order Raised</div>
      </td>      
    </tr>

    <tr>
      <td>
        <mat-form-field class=" tb100">
          <mat-label>Priority</mat-label>
          <mat-select name="Priority" formControlName="priorityId" required>
            <mat-option *ngFor="let p of lstPriority" [value]="p.priorityId">
              {{p.priorityName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmServiceRequest.get('PriorityId').value && frmServiceRequest.get('PriorityId').touched">Select Priority</mat-error>-->
      </td>

      <td>
        <mat-form-field class=" tb150">
          <mat-label>KMs Reading</mat-label>
          <input type="number" formControlName="kMsReading" min="1" max="99999999" matInput matTooltip="Enter Current KMs Reading" maxlength="12" oninput="validity.valid||(value='');" required />
        </mat-form-field>
        <!--<mat-error *ngIf="!frmServiceRequest.get('CurrentKMs').value && frmServiceRequest.get('CurrentKMs').touched">Enter Current Kms</mat-error>-->
      </td>

    </tr>
    <tr>
      <td colspan="2">
        <mat-form-field class=" tb350">
          <mat-label>Complaint Detail</mat-label>
          <textarea matInput formControlName="requestDetail" matTooltip="Enter Service Request Detail" maxlength="500"
                    cdkTextareaAutosize cdkAutosizeMinRows="2" cdkAutosizeMaxRows="5" required></textarea>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmServiceRequest.get('RequestDetail').value && frmServiceRequest.get('RequestDetail').touched">Enter Service Request Detail</mat-error>-->
      </td>
    </tr>

    <tr>      
      <td colspan="2">
        <mat-form-field class=" tb350">
          <mat-label>Remarks</mat-label>
          <textarea matInput formControlName="remarks" matTooltip="Enter Remarks" maxlength="500"
                    cdkTextareaAutosize
                    cdkAutosizeMinRows="2"
                    cdkAutosizeMaxRows="5"></textarea>
        </mat-form-field>
        <!--<mat-error *ngIf="!frmServiceRequest.get('Remarks').value && frmServiceRequest.get('Remarks').touched">Enter Remarks</mat-error>-->
      </td>
    </tr>
  </table>
</form>
<footer style="height: 9vh;">
  <div id="FooterButtons" class="float-right" *ngIf=" frmServiceRequest.get('stateId').value >0  ">
    <button type="button" [disabled]="submissionButtonsStatus" id="btnHistory" matTooltip="Click to view selected Service Request Status History" (click)="tbHistory(frmServiceRequest.get('requestId').value)" class="history"></button>
  </div>
  <div class="float-right" *ngIf="frmServiceRequest.get('stateId').value==1 && !frmServiceRequest.get('completed').value && frmServiceRequest.get('owner').value==this.footer.createdBy">
    <button type="button" [disabled]="submissionButtonsStatus" id="btnSubmit" matTooltip="Click to submit this complaint to workshop for action" (click)="tbFormSubmission(frmServiceRequest.get('requestId').value,2)" class="submit"></button>
  </div>
  <div class="float-right" *ngIf="frmServiceRequest.get('stateId').value==1 && frmServiceRequest.get('owner').value==this.currentUserId && !frmServiceRequest.get('completed').value &&
       frmServiceRequest.get('owner').value!=this.footer.createdBy">
    <button type="button" [disabled]="submissionButtonsStatus" id="btnReject" matTooltip="Click to reject this Service Request. This Service Request will no longer be actionable once you reject it!"
        (click)="tbFormSubmission(frmServiceRequest.get('requestId').value,5)" class="reject"></button>
  </div>
  <div class="float-right" *ngIf="frmServiceRequest.get('stateId').value==2  && frmServiceRequest.get('owner').value==this.currentUserId && !frmServiceRequest.get('completed').value &&
              frmServiceRequest.get('owner').value != this.footer.createdBy">
    <button type="button" id="btnApprove" matTooltip="Click to mark this Service Request as resolved" (click)="tbFormSubmission(frmServiceRequest.get('requestId').value,4)" class="approve"></button>
  </div>
  <div class="float-right" *ngIf="frmServiceRequest.get('stateId').value==2 && frmServiceRequest.get('owner').value==this.currentUserId && !frmServiceRequest.get('completed').value &&
       frmServiceRequest.get('owner').value!=this.footer.createdBy">
    <button type="button" id="btnReturn" matTooltip="Click to return this Service Request to Operations again" (click)="tbFormSubmission(frmServiceRequest.get('requestId').value,3)" class="return"></button>
  </div>
  <app-footer [items]="footer"></app-footer>
</footer>
