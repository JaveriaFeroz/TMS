<form [formGroup]="frmInsPolicy">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Insurance Policy</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>Policy Id</mat-label>
          <input formControlName="policyId" #policyId matTooltip="Insurance Policy Id, auto generated for new entry" matInput maxlength="3" numbersOnly (keydown.enter)="get(policyId.value)">
        </mat-form-field>
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="isActive" color="primary">Is Active</mat-slide-toggle>
      </td>
    </tr>

    <tr>
      <td >
        <mat-form-field class="tb200">
          <mat-label>Policy #</mat-label>
          <input formControlName="policyNo" #policyNo matTooltip="Enter Insurance Policy # given by Insurer"  matInput maxlength="50" required>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb200">
          <mat-label>Insurance Company</mat-label>
          <mat-select formControlName="insCompanyId">
            <mat-option *ngFor="let c of lstInsuranceCompany" [value]="c.companyId"> {{c.companyName}} </mat-option>
          </mat-select>
        </mat-form-field>
      </td>
    </tr>

    <tr>   
      <td>
        <mat-form-field class="tb120">
          <mat-label>From Date</mat-label>
          <input matInput [matDatepicker]="mdpFDate" matTooltip="Enter From Date" formControlName="fromDate" required>
          <mat-datepicker-toggle matSuffix [for]="mdpFDate"></mat-datepicker-toggle>
          <mat-datepicker #mdpFDate></mat-datepicker>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>To Date</mat-label>
          <input matInput [matDatepicker]="mdpTDate" matTooltip="Enter To Date" formControlName="toDate"  required>
          <mat-datepicker-toggle matSuffix [for]="mdpTDate"></mat-datepicker-toggle>
          <mat-datepicker #mdpTDate></mat-datepicker>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="5">
        <div class="divAssetGrid">
          <div class="grdToolbar" id="tbGrid">
            <button type="button" (click)="onAddAssetLine()" class="add" title="Add line item"></button>
            <button type="button" (click)="onDeleteAssetLine()" class="delete" title="Remove selected line item"></button>
          </div>
          <ag-grid-angular class="ag-theme-balham grdAsset" id="grdAsset"
            [gridOptions]="goAsset" [columnDefs]="colAsset" [rowData]="assetData"></ag-grid-angular>
        </div>
      </td>
      <td colspan="2">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
