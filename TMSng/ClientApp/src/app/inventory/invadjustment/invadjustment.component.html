<form [formGroup]="frmInvAdjustment">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Inventory Adjustment</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <div id="divSave" class="float-left">
            <button type="button" id="btnSave" *ngIf="!frmInvAdjustment.get('adjId').value" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          </div>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>Adj #</mat-label>
          <input formControlName="adjId" #adjId matTooltip="Adjustment ticket #, auto generated for new entry" matInput maxlength="6" numbersOnly (keydown.enter)="get(adjId.value)">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb130">
          <mat-label>Date</mat-label>
          <input  [matDatepicker]="mdpAdjustment" formControlName="adjDate" [min]="minDate" [max]="maxDate" matTooltip="Adjustment Date" matInput required>
          <mat-datepicker-toggle matSuffix [for]="mdpAdjustment"></mat-datepicker-toggle>
          <mat-datepicker #mdpAdjustment></mat-datepicker>
        </mat-form-field>
      </td>
      <td colspan="5"></td>
      <td colspan="2"></td>
      <td></td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb200">
          <mat-label>Branch </mat-label>
          <mat-select formControlName="branchId" #branchId required>
            <mat-option *ngFor="let b of lstBranch" [value]="b.branchId"> {{b.branchName}} </mat-option>
          </mat-select>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="5">
        <div class="divInvAdjGrid">
          <div class="grdToolbar" id="tbGrid">
            <button type="button" (click)="onAddLine()" id="btnGridAdd" class="add" title="Add Line Item"></button>
            <button type="button" (click)="onDeleteLine()" id="btnGridDelete" class="delete" title="Remove selected line item"></button>
          </div>
          <ag-grid-angular class="ag-theme-balham grdInvAdj" id="grdInvAdj"
                           [gridOptions]="goAdjustment" [columnDefs]="colAdjustment" [rowData]="adjustmentData"></ag-grid-angular>
        </div>
      </td>
      <td colspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
