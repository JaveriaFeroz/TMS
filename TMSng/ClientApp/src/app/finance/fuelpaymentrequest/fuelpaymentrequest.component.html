<form [formGroup]="frmFP">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Fuel Payment Request</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <div id="divSave" class="float-left">
            <button type="button" id="btnSave" *ngIf="!frmFP.get('requestId').value" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          </div>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>


    <tr>
      <td>
        <mat-form-field class="tb120" color="accent">
          <mat-label>Request #</mat-label>
          <input formControlName="requestId" #requestId matTooltip="Fuel Payment Request Id, auto generated for new entry" placeholder="Request #" matInput maxlength="6" numbersOnly (keydown.enter)="get(requestId.value)">
        </mat-form-field>
      </td>

      <!--<td >
      <mat-radio-group formControlName="PaymentType">
        <mat-radio-button value="1" id="rdoCreditFuel" ng-disabled="readOnly">Credit Fuel</mat-radio-button>
        <mat-radio-button value="2" id="rdoFuelCard" ng-disabled="readOnly">Fuel Card</mat-radio-button>
      </mat-radio-group>
    </td>
    <td></td>
    <td></td>-->
      <td colspan="4"></td>
      <!--<td colspan="5"></td>
      <td></td>-->
    </tr>

    <tr>
      <td class="slider" style="padding-top: 20px;">
        <mat-slide-toggle formControlName="isCardPayment" color="primary" #isCardPayment
                          title="Turn on if this payment request is made against Fuel Card to select from qualifying fuel entries that will be tagged against this request">Is Fuel Card Payment?</mat-slide-toggle>
      </td>
      <td>
        <mat-form-field class="tb250" *ngIf="frmFP.get('isCardPayment').value==true">
          <mat-label>Card #</mat-label>
          <mat-select name="cardId" #cardId formControlName="cardId">
            <mat-option *ngFor="let c of lstCard" [value]="c.cardId">
              {{c.cardNo}}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field class="tb250" *ngIf="!frmFP.get('isCardPayment').value">
          <mat-label>Supplier</mat-label>
          <mat-select name="supplierId" #supplierId formControlName="supplierId">
            <mat-option *ngFor="let s of lstSupplier" [value]="s.supplierId">
              {{s.supplierName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Date From</mat-label>
          <input formControlName="dateFrom" [min]="minDate" [max]="maxDate" [matDatepicker]="dpFrom" matTooltip="Date From" matInput required>
          <mat-datepicker-toggle matSuffix [for]="dpFrom"></mat-datepicker-toggle>
          <mat-datepicker #dpFrom></mat-datepicker>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Date To</mat-label>
          <input formControlName="dateTo" [min]="minDate" [max]="maxDate" [matDatepicker]="dpTo" matTooltip="Date To" matInput required>
          <mat-datepicker-toggle matSuffix [for]="dpTo"></mat-datepicker-toggle>
          <mat-datepicker #dpTo></mat-datepicker>
        </mat-form-field>
      </td>

      <td>
        <button type="button" id="btnLoad" matTooltip="Load"
                *ngIf="!frmFP.get('requestId').value" (click)="tbLoad()" class="load float-left"></button>
      </td>
    </tr>

    <tr style="height: 20px"></tr>

    <tr>
      <td colspan="5">
        <div class="divFPGrid">
          <ag-grid-angular class="ag-theme-balham grdDetail" id="grdDetail"
                           [gridOptions]="goDetail" [columnDefs]="colDetail" [rowData]="detailData"></ag-grid-angular>
        </div>
      </td>
      <td colspan="3" style="vertical-align:top">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer >
    <app-footer [items]="footer"></app-footer>
</footer>
