<form [formGroup]="frmCoA">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Chart Of Accounts</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <button type="button" id="btnSave" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb60" color="accent">
          <mat-label>A/c Code</mat-label>
          <input formControlName="accountCode" #accountCode matTooltip="Account Code, auto generated for new entry" matInput maxlength="6" numbersOnly (keydown.enter)="get(accountCode.value)">
        </mat-form-field>
      </td>
      <td><mat-checkbox formControlName="isActive" matInput>Active</mat-checkbox></td>
      <td colspan="3"></td>
      <td colspan="2"></td>
      <td colspan="3"></td>
    </tr>

    <tr>
      <td colspan="2">
        <mat-form-field class="tb250">
          <mat-label>Account Name</mat-label>
          <input formControlName="accountName" #accountName matTooltip="Account Name" matInput maxlength="100" required>
        </mat-form-field>
      </td>
      <td></td>
      <td colspan="3">
        <mat-form-field class="tb300" *ngIf="frmCoA.get('accountCode').value">
          <mat-label>Hierarchy</mat-label>
          <input formControlName="hierarchy" matTooltip="Account Hierarchy" matInput readonly tabindex="-1">
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb150">
          <mat-label>Account Type</mat-label>
          <mat-select (selectionChange)="onACTypeChanged($event.value)" formControlName="accountTypeId" required *ngIf="!frmCoA.get('accountCode').value">
            <mat-option *ngFor="let act of lstAccountType" [value]="act.typeId">
              {{act.typeName}}
            </mat-option>
          </mat-select>
          <input formControlName="accountTypeName" #accountTypeName matInput readonly tabindex="-1" *ngIf="frmCoA.get('accountCode').value">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb200" *ngIf="frmCoA.get('accountTypeId').value != 1">
          <mat-label>Parent Account</mat-label>
          <mat-select formControlName="parentAccountId" required *ngIf="!frmCoA.get('accountCode').value">
            <mat-option *ngFor="let ac of lstAccount" [value]="ac.accountId">
              {{ac.accountName}}
            </mat-option>
          </mat-select>
          <input formControlName="parentAccountName" #parentAccountName matInput readonly tabindex="-1" *ngIf="frmCoA.get('accountCode').value">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>HFM Code</mat-label>
          <input formControlName="hfmCode" max="9999999" matTooltip="Enter HFM Code for month end reporting" maxlength="7" matInput oninput="validity.valid||(value='');">
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb100">
          <mat-label>Op. Balance</mat-label>
          <input type="number" formControlName="opBalance" min="0" max="999999999999" matTooltip="Account opening balance" maxlength="12" matInput oninput="validity.valid||(value='');" required>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Op. Bal Date</mat-label>
          <input matInput [matDatepicker]="picker" [max]="maxDate" matTooltip="Opening balance date" formControlName="opBalanceDate" required>
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="3">
        <mat-form-field class="tb500">
          <mat-label>Remarks</mat-label>
          <textarea matInput formControlName="remarks" matTooltip="Enter additional description / remarks" maxlength="200"
                    cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="3"></textarea>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="5" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>

    <!--<tr>
    <td >
      <mat-label>Level2</mat-label>

    </td>
    <td>
      <input formControlName="Level2" matTooltip="Level2" matInput readonly>
    </td>
  </tr>
  <tr>
    <td >
      <mat-label>Level3</mat-label>
    </td>
    <td>
      <input formControlName="Level3" matTooltip="Level3" matInput readonly>
    </td>
  </tr>
  <tr>
    <td >
      <mat-label>Level4</mat-label>

    </td>
    <td>
      <input formControlName="Level4" matTooltip="Level4" matInput readonly>
    </td>
  </tr>-->
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
