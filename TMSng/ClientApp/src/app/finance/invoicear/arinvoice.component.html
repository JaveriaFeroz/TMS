<form [formGroup]="frmInvoice">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Customer Invoice</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnReverse" matTooltip="Click to Reverse current Entry" *ngIf="frmInvoice.get('invoiceNo').value !=null && frmInvoice.get('periodId').value &&
                  !frmInvoice.get('reversedInvoiceNo').value && !frmInvoice.get('sourceInvoiceNo').value" (click)="tbReverse(frmInvoice.get('invoiceNo').value)" class="reverse"></button>
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <div id="divSave" class="float-left">
            <button type="button" id="btnSave" matTooltip="Click to Save current Entry" *ngIf="!frmInvoice.get('invoiceNo').value" (click)="tbSave()" class="save"></button>
          </div>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb120" color="accent">
          <mat-label>Invoice #</mat-label>
          <input formControlName="invoiceNo" #invoiceNo matTooltip="Invoice #, auto generated for new entry" matInput maxlength="10" (keydown.enter)="get(invoiceNo.value)">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Invoice Date</mat-label>
          <input matInput [matDatepicker]="mdpInvoice" [min]="minDate" [max]="maxDate" matTooltip="Invoice Date" formControlName="invoiceDate" required>
          <mat-datepicker-toggle matSuffix [for]="mdpInvoice"></mat-datepicker-toggle>
          <mat-datepicker #mdpInvoice></mat-datepicker>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Period</mat-label>
          <mat-select formControlName="periodId" #periodId required *ngIf="!frmInvoice.get('invoiceNo').value">
            <mat-option *ngFor="let p of lstPeriod" [value]="p.periodId">
              {{p.periodName}}
            </mat-option>
          </mat-select>
          <input formControlName="periodName" matInput readonly *ngIf="frmInvoice.get('invoiceNo').value" />
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120" *ngIf="frmInvoice.get('reversedInvoiceNo').value">
          <mat-label>Reversed Inv #</mat-label>
          <input formControlName="reversedInvoiceNo" matInput readonly />
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb120" *ngIf="frmInvoice.get('sourceInvoiceNo').value">
          <mat-label>Source Inv #</mat-label>
          <input formControlName="sourceInvoiceNo" matInput readonly />
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="2">
        <mat-form-field class="tb250">
          <mat-label>Client</mat-label>
          <mat-select formControlName="clientId" #clientId required>
            <mat-option *ngFor="let c of lstClient" [value]="c.clientId">
              {{c.clientName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Client Inv #</mat-label>
          <input formControlName="clientInvNo" matTooltip="Client Invoice #" matInput maxlength="50" required>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Client Inv Date</mat-label>
          <input matInput [matDatepicker]="mdpClient" [min]="minDate" [max]="maxDate" matTooltip="Customer's Invoice Date" formControlName="clientInvDate" required>
          <mat-datepicker-toggle matSuffix [for]="mdpClient"></mat-datepicker-toggle>
          <mat-datepicker #mdpClient></mat-datepicker>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Amount</mat-label>
          <input type="number" formControlName="amount" min="0" step="0.10" max="99999999999" maxlength="15" matInput required />
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="10">
        <mat-form-field class="tb500">
          <mat-label>Narration</mat-label>
          <textarea matInput formControlName="narration" matTooltip="Enter Remarks" maxlength="500"
                    cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="3"></textarea>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="7">
        <div class="divAIGrid">
          <div class="grdToolbar" id="tbGrid">
            <button type="button" (click)="onAddLine()" id="btnGridAdd" class="add" title="Add Line Item"></button>
            <button type="button" (click)="onDeleteLine()" id="btnGridDelete" class="delete" title="Remove Line Item"></button>
          </div>
          <ag-grid-angular class="ag-theme-balham grdDetail" id="grdDetail" (cellValueChanged)="grdDetailCellValueChanged($event)"
                           [gridOptions]="goDetail" [columnDefs]="colDetail" [rowData]="detailData"></ag-grid-angular>
        </div>
      </td>
      <td colspan="3" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
