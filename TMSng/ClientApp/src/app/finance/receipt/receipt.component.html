<form [formGroup]="frmReceipt">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Receipt</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnReverse" matTooltip="Click to Reverse current Entry" *ngIf="frmReceipt.get('receiptNo').value && frmReceipt.get('periodId').value &&
            !frmReceipt.get('reversedReceiptNo').value && !frmReceipt.get('sourceReceiptNo').value" (click)="tbReverse(frmReceipt.get('receiptNo').value)" class="reverse"></button>
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <div id="divSave" class="float-left">
            <button type="button" id="btnSave" matTooltip="Click to Save current Entry" *ngIf="frmReceipt.get('receiptNo').value ==null" (click)="tbSave()" class="save"></button>
          </div>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb120" color="accent">
          <mat-label>Receipt #</mat-label>
          <input formControlName="receiptNo" #receiptNo matTooltip="Receipt #, auto generated for new entry" matInput maxlength="10" (keydown.enter)="get(receiptNo.value)">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Receipt Date</mat-label>
          <input matInput [matDatepicker]="mdgReceipt" [min]="minDate" [max]="maxDate" matTooltip="Receipt Date" formControlName="receiptDate" required>
          <mat-datepicker-toggle matSuffix [for]="mdgReceipt"></mat-datepicker-toggle>
          <mat-datepicker #mdgReceipt></mat-datepicker>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Period</mat-label>
          <mat-select formControlName="periodId" #periodId *ngIf="!frmReceipt.get('receiptNo').value" required>
            <mat-option *ngFor="let p of lstPeriod" [value]="p.periodId">
              {{p.periodName}}
            </mat-option>
          </mat-select>
          <input formControlName="periodName" matInput readonly *ngIf="frmReceipt.get('receiptNo').value" />
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120" *ngIf="frmReceipt.get('reversedReceiptNo').value">
          <mat-label>Reversed Receipt #</mat-label>
          <input formControlName="reversedReceiptNo" matInput readonly />
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb120" *ngIf="frmReceipt.get('sourceReceiptNo').value">
          <mat-label>Source Receipt #</mat-label>
          <input formControlName="sourceReceiptNo" matInput readonly />
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="2">
        <mat-form-field class="tb300">
          <mat-label>Bank Account</mat-label>
          <mat-select formControlName="bankAccountId" #bankAccountId required (selectionChange)="onBankChanged()">
            <mat-option *ngFor="let b of lstBankAccount" [value]="b.accountId">
              {{b.accountName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td colspan="2">
        <mat-form-field class="tb300">
          <mat-label>Client</mat-label>
          <mat-select formControlName="clientId" required>
            <mat-option *ngFor="let c of lstClient" [value]="c.clientId">
              {{c.clientName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120 tbRA">
          <mat-label>Amount</mat-label>
          <input type="number" formControlName="amount" min="0" step="0.10" max="99999999999" maxlength="14" matInput required (blur)="generateEntries()" />
        </mat-form-field>
      </td>
      <td>
        <button type="button" id="btnAllocation" matTooltip="Select/View applicable Invoice for this Receipt" [disabled]="!frmReceipt.get('clientId').value"
                (click)="tbAllocation()" class="view"></button>
      </td>
    </tr>

    <tr>
      <td colspan="5">
        <mat-form-field class="tb500">
          <mat-label>Remarks</mat-label>
          <textarea matInput formControlName="narration" matTooltip="Enter Remarks" maxlength="500"
                    cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="3"></textarea>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Cheque #</mat-label>
          <input formControlName="chequeNo" matTooltip="Enter Cheque #" placeholder="Cheque #" matInput maxlength="15" required>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Cheque Date</mat-label>
          <input matInput [matDatepicker]="mdpCheque" [min]="minDate" [max]="maxDate" matTooltip="Cheque Date" formControlName="chequeDate" required>
          <mat-datepicker-toggle matSuffix [for]="mdpCheque"></mat-datepicker-toggle>
          <mat-datepicker #mdpCheque></mat-datepicker>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="7">
        <div class="divRCGrid">
          <div class="grdToolbar" id="tbGrid">
            <button type="button" (click)="onAddLine()" id="btnGridAdd" class="add" title="Add Line Item"></button>
            <button type="button" (click)="onDeleteLine()" id="btnGridDelete" class="delete" title="Remove Line Item"></button>
          </div>
          <ag-grid-angular class="ag-theme-balham grdDetail" id="grdDetail" (cellValueChanged)="grdDetailCellValueChanged($event)"
              [gridOptions]="goDetail" [columnDefs]="colDetail" [rowData]="detailData"></ag-grid-angular>
        </div>
      </td>
      <td colspan="3" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
