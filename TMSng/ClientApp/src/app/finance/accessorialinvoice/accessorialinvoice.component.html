<form [formGroup]="frmAI">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">{{optionName}}</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <div id="divSave" class="float-left">
            <button type="button" id="btnSave" matTooltip="Click to Save current Entry" *ngIf="!frmAI.get('invoiceNo').value" (click)="tbSave()" class="save"></button>
          </div>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td >
        <mat-form-field class="tb120" color="accent">
          <mat-label>Invoice #</mat-label>
          <input formControlName="invoiceNo" #invoiceNo matTooltip="Invoice #, auto generated for new entry" matInput maxlength="14" (keydown.enter)="get(invoiceNo.value)">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Invoice Date</mat-label>
          <input matInput [matDatepicker]="dpInvoice" [min]="minDate" [max]="maxDate" matTooltip="Invoice Date" formControlName="invoiceDate" required>
          <mat-datepicker-toggle matSuffix [for]="dpInvoice"></mat-datepicker-toggle>
          <mat-datepicker #dpInvoice></mat-datepicker>
        </mat-form-field>
      </td>

      <td colspan="3"></td>
    </tr>

    <tr>
      <td colspan="2">
        <mat-form-field class="tb300">
          <mat-label>Client</mat-label>
          <mat-select formControlName="clientId" #clientId required>
            <mat-option *ngFor="let c of lstClient" [value]="c.clientId">
              {{c.clientName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td >
        <mat-form-field class="tb90 tbRA">
          <mat-label>GST %</mat-label>
          <input type="number" formControlName="gstRate" min="0" step="0.05" max="100" matTooltip="GST % to be charged on this invoice" maxlength="5" matInput oninput="validity.valid||(value='');" required>
        </mat-form-field>
      </td>

      <td  colspan="4">
        <mat-form-field class="tb500">
          <mat-label>Remarks</mat-label>
          <textarea matInput formControlName="remarks" matTooltip="Enter Remarks, if any" maxlength="500"
            cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="3" required></textarea>
        </mat-form-field>
      </td>
    </tr>

    <tr *ngIf="workFlowId > 53">
      <td>
        <mat-form-field class="tb120">
          <mat-label>Ref Invoice #</mat-label>
          <input formControlName="refInvNo"  matTooltip="Reference Invoice #"  matInput maxlength="14">
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb120">
          <mat-label>Ref Inv Date</mat-label>
          <input formControlName="refInvDate"  matTooltip="Referenced Invoice Date"  matInput readonly tabindex="-1">
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb120">
          <mat-label>Ref Inv Period</mat-label>
          <input formControlName="refInvPeriod"  matTooltip="Referenced Invoice Period"  matInput readonly tabindex="-1">
        </mat-form-field>
     </td>
    </tr>

    <tr>
      <td colspan="5">
        <div divAIGrid>
          <div class="grdToolbar" id="tbGrid">
            <button type="button" (click)="onAddLine()" id="btnGridAdd" class="add" title="Add new line item"></button>
            <button type="button" (click)="onDeleteLine()" id="btnGridDelete" class="delete" title="Remove selected line item"></button>
          </div>
          <ag-grid-angular class="ag-theme-balham grdAI" id="agGrid" (cellValueChanged)="grdDetailCellValueChanged($event)"
            [gridOptions]="goDetail" [columnDefs]="colDetail" [rowData]="detailData"></ag-grid-angular>
        </div>
      </td>
      <td colspan="2" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
