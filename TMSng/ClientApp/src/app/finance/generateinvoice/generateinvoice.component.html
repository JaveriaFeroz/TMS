<form [formGroup]="frmInvoice">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Generate Invoice</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">          
          <button type="button" id="btnSave" matTooltip="Click to Generate Inovice" (click)="tbSave()" class="save"></button>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td colspan="2">
        <mat-form-field class="tb220">
          <mat-label>Client</mat-label>
          <mat-select (selectionChange)="onChange($event.value)" formControlName="clientId" #clientid required>
            <mat-option *ngFor="let Client of lstClient" [value]="Client.clientId">
              {{Client.clientName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>
      <td class="slider">
        <mat-slide-toggle formControlName="reapplyRate" color="primary">Re Apply Rate</mat-slide-toggle>
      </td>
      <td></td>
      <td colspan="3"></td>
    </tr>

    <tr>
      <td >
        <mat-form-field class="tb100">
          <mat-label>Invoice From</mat-label>
          <input matInput [matDatepicker]="dpDateTo" [min]="MinDate" [max]="MaxDate" matTooltip="Invoice From" formControlName="invoiceFrom" required>
          <mat-datepicker-toggle matSuffix [for]="dpDateTo"></mat-datepicker-toggle>
          <mat-datepicker #dpDateTo></mat-datepicker>
        </mat-form-field>
      </td>

      <td >
        <mat-form-field class="tb100">
          <mat-label>Invoice To</mat-label>
          <input matInput [matDatepicker]="dpDateFrom" [min]="MinDate" [max]="MaxDate" matTooltip="Invoice To" formControlName="invoiceTo"  required>
          <mat-datepicker-toggle matSuffix [for]="dpDateFrom"></mat-datepicker-toggle>
          <mat-datepicker #dpDateFrom></mat-datepicker>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Tax Rate</mat-label>
          <input type="number" formControlName="taxRate" min="0" step="0.01" max="100" matTooltip="Tax " maxlength="5" matInput  oninput="validity.valid||(value=''); ">
        </mat-form-field>
      </td>
    </tr> 
  </table>
</form>
