<form [formGroup]="frmPIV">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Purchase Invoice</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnReverse" matTooltip="Click to Reverse this Purchase Invoice" *ngIf="frmPIV.get('pivNo').value && frmPIV.get('periodId').value &&
                  !frmPIV.get('reversedPIVNo').value && !frmPIV.get('sourcePIVNo').value" (click)="tbReverse(frmPIV.get('pivNo').value)" class="reverse"></button>
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <div id="divSave" class="float-left">
            <button type="button" id="btnSave" matTooltip="Click to Save current Entry" *ngIf="!frmPIV.get('pivNo').value" (click)="tbSave()" class="save"></button>
          </div>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb120" color="accent">
          <mat-label>PIV #</mat-label>
          <input formControlName="pivNo" #pivNo matTooltip="Payment Invoice #, auto generated for new entry" matInput maxlength="10" (keydown.enter)="get(pivNo.value)">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>PIV Date</mat-label>
          <input matInput [matDatepicker]="mdpPIV" [min]="minDate" [max]="maxDate" matTooltip="Payment Invoice Date" formControlName="pivDate" required>
          <mat-datepicker-toggle matSuffix [for]="mdpPIV"></mat-datepicker-toggle>
          <mat-datepicker #mdpPIV></mat-datepicker>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Period</mat-label>
          <mat-select formControlName="periodId" #periodId required *ngIf="!frmPIV.get('pivNo').value">
            <mat-option *ngFor="let p of lstPeriod" [value]="p.periodId">
              {{p.periodName}}
            </mat-option>
          </mat-select>
          <input formControlName="periodName" matInput readonly *ngIf="frmPIV.get('pivNo').value" />
        </mat-form-field>
      </td>     

      <td>
        <mat-form-field class="tb120" *ngIf="frmPIV.get('reversedPIVNo').value">
          <mat-label>Reversed PIV #</mat-label>
          <input formControlName="reversedPIVNo" matInput readonly />
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb120" *ngIf="frmPIV.get('sourcePIVNo').value">
          <mat-label>Source PIV #</mat-label>
          <input formControlName="sourcePIVNo" matInput readonly />
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="2">
        <mat-form-field class="tb250">
          <mat-label>Supplier</mat-label>
          <mat-select formControlName="supplierId" #supplierId required>
            <mat-option *ngFor="let s of lstSupplier" [value]="s.supplierId">
              {{s.supplierName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Supplier Inv#</mat-label>
          <input formControlName="supplierInvNo" matTooltip="Supplier's Invoice #" matInput maxlength="50" required>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Inv Date</mat-label>
          <input matInput [matDatepicker]="mdpInvoice" [min]="minDate" [max]="maxDate" matTooltip="Supplier Invoice Date" formControlName="supplierInvDate" required>
          <mat-datepicker-toggle matSuffix [for]="mdpInvoice"></mat-datepicker-toggle>
          <mat-datepicker #mdpInvoice></mat-datepicker>
        </mat-form-field>
      </td>

      <td>
          <mat-form-field class="tb100">
            <mat-label>Inv Amount</mat-label>
            <input type="number" formControlName="amount" min="0" step="0.10" max="99999999999" maxlength="15" matInput required>
          </mat-form-field>
      </td>      
    </tr>

    <tr>
      <td class="slider">
        <mat-slide-toggle formControlName="hasSlip" color="primary" #hasSlip
            title="Turn on to select date range for Fuel Slip and selected from qualifying Fuel slips that will be paid tagged to this invoice">Fuel Slips Applicable?</mat-slide-toggle>
      </td>
      <td>
        <mat-form-field class="tb120" *ngIf="frmPIV.get('hasSlip').value">
          <mat-label>Date From</mat-label>
          <input matInput [matDatepicker]="mdpDateFrom" [min]="minDate" [max]="maxDate" matTooltip="Fuel slip date from" formControlName="slipDateFrom" required>
          <mat-datepicker-toggle matSuffix [for]="mdpDateFrom"></mat-datepicker-toggle>
          <mat-datepicker #mdpDateFrom></mat-datepicker>
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb120" *ngIf="frmPIV.get('hasSlip').value">
          <mat-label>Date To</mat-label>
          <input matInput [matDatepicker]="mdpDateTo" [min]="minDate" [max]="maxDate" matTooltip="Fuel slip date to" formControlName="slipDateTo" required>
          <mat-datepicker-toggle matSuffix [for]="mdpDateTo"></mat-datepicker-toggle>
          <mat-datepicker #mdpDateTo></mat-datepicker>
        </mat-form-field>
      </td>
      <td>
        <button type="button" id="btnSlip" matTooltip="Select applicable fuel slip(s) for this purchase invoice"
                (click)="tbSlip()" *ngIf="frmPIV.get('hasSlip').value" class="find"></button>
      </td>
    </tr>

    <tr>
      <td colspan="10">
        <mat-form-field class="tb500">
          <mat-label>Narration</mat-label>
          <textarea matInput formControlName="narration" matTooltip="Enter Remarks" maxlength="500"
            cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="3"></textarea>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="7">
        <div class="divPIVGrid">
          <div class="grdToolbar" id="tbGrid">
            <button type="button" (click)="onAddLine()" id="btnGridAdd" class="add" title="Add Line Item"></button>
            <button type="button" (click)="onDeleteLine()" id="btnGridDelete" class="delete" title="Remove Line Item"></button>
          </div>
          <ag-grid-angular class="ag-theme-balham grdDetail" id="grdDetail" (cellValueChanged)="grdDetailCellValueChanged($event)"
            [gridOptions]="goDetail" [columnDefs]="colDetail" [rowData]="detailData"></ag-grid-angular>
        </div>
      </td>
      <td colspan="3" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
