<form [formGroup]="frmER">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Expense ReImbursement</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <!--<button type="button" id="btnClose" *ngIf="frmER.get('requestId').value > 0 && frmER.get('Closed').value== 0 " matTooltip="Click to close Expense ReImbursement" (click)="tbClose(frmER.get('requestId').value)" class="close"></button>-->
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <div id="divSave" class="float-left">
            <button type="button" id="btnSave" *ngIf="!frmER.get('requestId').value" matTooltip="Click to Save current Entry" (click)="tbSave()" class="save"></button>
          </div>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>


    <tr>
      <td>
        <mat-form-field class="tb120" color="accent">
          <mat-label>Request #</mat-label>
          <input formControlName="requestId" #requestId matTooltip="Expense Re Imbursement Id, auto generated for new entry" placeholder="Request #" matInput maxlength="3" numbersOnly (keydown.enter)="get(requestId.value)">
        </mat-form-field>
      </td>
      <td colspan="6"></td>
      <td colspan="3" rowspan="2" style="vertical-align:top">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb250">
          <mat-label>Branch</mat-label>
          <mat-select name="branchId" #branchId formControlName="branchId" required>
            <mat-option *ngFor="let b of lstBranch" [value]="b.branchId">
              {{b.branchName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Period From</mat-label>
          <mat-select name="periodFromId" #periodFromId formControlName="periodFromId" required>
            <mat-option *ngFor="let p of lstPeriod" [value]="p.periodId">
              {{p.periodName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb100">
          <mat-label>Period To</mat-label>
          <mat-select name="periodToId" #periodToId formControlName="periodToId" required>
            <mat-option *ngFor="let p of lstPeriod" [value]="p.periodId">
              {{p.periodName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <button type="button" id="btnLoad" matTooltip="Load"
                *ngIf="!frmER.get('requestId').value" (click)="tbLoad()" class="load float-left"></button>
      </td>
    </tr>

    <tr style="height: 20px"></tr>

    <tr>
      <td colspan="9">
        <div class="divERGrid">
          <ag-grid-angular class="ag-theme-balham grdDetail" id="grdDetail"
            [gridOptions]="goDetail" [columnDefs]="colDetail" [rowData]="detailData"></ag-grid-angular>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer >
  <app-footer [items]="footer"></app-footer>
</footer>
