<form [formGroup]="frmPY">
  <table class="mainTable">
    <tr class="form-title-bg">
      <td colspan="5">
        <p class="form-title">Payment</p>
      </td>
      <td colspan="5">
        <div id="divHToolbar" class="float-right">
          <button type="button" id="btnReverse" matTooltip="Click to Reverse current Entry" *ngIf="frmPY.get('pyNo').value && frmPY.get('periodId').value &&
                  !frmPY.get('reversedPYNo').value && !frmPY.get('sourcePYNo').value" (click)="tbReverse(frmPY.get('pyNo').value)" class="reverse"></button>
          <button type="button" id="btnSearch" matTooltip="Search from lookup list" (click)="tbSearch()" class="find"></button>
          <button type="button" id="btnRecall" matTooltip="Click to Recall existing Entry" (click)="tbRecall()" class="recall"></button>
          <button type="button" id="btnAdd" matTooltip="Click to create new Entry" (click)="tbAdd()" class="add"></button>
          <button type="button" id="btnEdit" matTooltip="Click to Edit current Entry" (click)="tbEdit()" class="edit"></button>
          <div id="divSave" class="float-left">
            <button type="button" id="btnSave" matTooltip="Click to Save current Entry" *ngIf="!frmPY.get('pyNo').value" (click)="tbSave()" class="save"></button>
          </div>
          <button type="button" id="btnUndo" matTooltip="Click to discard changes made since last save operation" (click)="tbUndo()" class="undo"></button>
          <button type="button" id="btnExit" matTooltip="Click to go back to main menu" (click)="tbExit()" class="exit"></button>
        </div>
      </td>
    </tr>

    <tr>
      <td>
        <mat-form-field class="tb120" color="accent">
          <mat-label>Payment #</mat-label>
          <input formControlName="pyNo" #pyNo matTooltip="payment #, auto generated for new entry" matInput maxlength="10" (keydown.enter)="get(pyNo.value)">
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Payment Date</mat-label>
          <input matInput [matDatepicker]="mdpPayment" [min]="minDate" [max]="maxDate" matTooltip="Payment Date" formControlName="pyDate" required>
          <mat-datepicker-toggle matSuffix [for]="mdpPayment"></mat-datepicker-toggle>
          <mat-datepicker #mdpPayment></mat-datepicker>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120">
          <mat-label>Period</mat-label>
          <mat-select formControlName="periodId" #periodId *ngIf="!frmPY.get('pyNo').value" required>
            <mat-option *ngFor="let p of lstPeriod" [value]="p.periodId">
              {{p.periodName}}
            </mat-option>
          </mat-select>
          <input formControlName="periodName" matInput readonly *ngIf="frmPY.get('pyNo').value" />
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120" *ngIf="frmPY.get('reversedPYNo').value">
          <mat-label>Reversed PY #</mat-label>
          <input formControlName="reversedPYNo" matInput readonly />
        </mat-form-field>
      </td>
      <td>
        <mat-form-field class="tb120" *ngIf="frmPY.get('sourcePYNo').value">
          <mat-label>Source PY #</mat-label>
          <input formControlName="sourcePYNo" matInput readonly />
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="2">
        <mat-form-field class="tb300">
          <mat-label>Bank Account</mat-label>
          <mat-select formControlName="bankAccountId" #bankAccountId required (selectionChange)="onBankChanged()">
            <mat-option *ngFor="let b of lstBankAccount" [value]="b.accountId">
              {{b.accountName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td colspan="2">
        <mat-form-field class="tb300">
          <mat-label>Supplier</mat-label>
          <mat-select formControlName="supplierId" required>
            <mat-option *ngFor="let s of lstSupplier" [value]="s.supplierId">
              {{s.supplierName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120 tbRA">
          <mat-label>Amount</mat-label>
          <input type="number" formControlName="amount" min="0" step="0.10" max="99999999999" maxlength="14" matInput required (blur)="generateEntries()" />
        </mat-form-field>
      </td>
      <td>
        <button type="button" id="btnAllocation" matTooltip="Select/View applicable AP Invoice for this Payment" [disabled]="!frmPY.get('supplierId').value"
                (click)="tbAllocation()" class="view"></button>
      </td>
    </tr>

    <tr>
      <td colspan="2">
        <mat-form-field class="tb200">
          <mat-label>Payment Instrument</mat-label>
          <mat-select (selectionChange)="onPaymentInstrumentChanged($event)" formControlName="instrumentId" required>
            <mat-option *ngFor="let i of lstInstrument" [value]="i.instrumentId">
              {{i.instrumentName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb200" *ngIf="frmPY.get('instrumentId').value==1">
          <mat-label>Cheque Book</mat-label>
          <mat-select formControlName="chequeBookId" #chequeBookId required>
            <mat-option *ngFor="let cb of lstChequeBook" [value]="cb.bookId">
              {{cb.bookName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120" *ngIf="frmPY.get('instrumentId').value==1">
          <mat-label>Cheque #</mat-label>
          <input formControlName="chequeNo" matTooltip="Enter Cheque #" placeholder="Cheque #" matInput maxlength="15" required>
        </mat-form-field>
      </td>

      <td>
        <mat-form-field class="tb120" *ngIf="frmPY.get('instrumentId').value==1">
          <mat-label>Cheque Date</mat-label>
          <input matInput [matDatepicker]="mdpCheque" [min]="minDate" [max]="maxDate" matTooltip="Cheque Date" formControlName="chequeDate" required>
          <mat-datepicker-toggle matSuffix [for]="mdpCheque"></mat-datepicker-toggle>
          <mat-datepicker #mdpCheque></mat-datepicker>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="5">
        <mat-form-field class="tb500">
          <mat-label>Remarks</mat-label>
          <textarea matInput formControlName="narration" matTooltip="Enter Remarks" maxlength="500"
                    cdkTextareaAutosize cdkAutosizeMinRows="1" cdkAutosizeMaxRows="3"></textarea>
        </mat-form-field>
      </td>
    </tr>

    <tr>
      <td colspan="7">
        <div class="divPYGrid">
          <div class="grdToolbar" id="tbGrid">
            <button type="button" (click)="onAddLine()" id="btnGridAdd" class="add" title="Add Line Item"></button>
            <button type="button" (click)="onDeleteLine()" id="btnGridDelete" class="delete" title="Remove Line Item"></button>
          </div>
          <ag-grid-angular class="ag-theme-balham grdDetail" id="grdDetail" (cellValueChanged)="grdDetailCellValueChanged($event)"
                           [gridOptions]="goDetail" [columnDefs]="colDetail" [rowData]="detailData"></ag-grid-angular>
        </div>
      </td>
      <td colspan="3" rowspan="3">
        <div *ngIf="errors?.length > 0" class="validation-summary-errors">
          <span>Validation:</span>
          <ul>
            <li *ngFor="let error of errors">{{error}}</li>
          </ul>
        </div>
      </td>
    </tr>
  </table>
</form>
<footer>
  <app-footer [items]="footer"></app-footer>
</footer>
